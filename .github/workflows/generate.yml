name: Veo → Drive Pending

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai google-api-python-client google-auth requests

      - name: Generate video with Veo and upload to Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_PENDING_FOLDER_ID: ${{ secrets.DRIVE_PENDING_FOLDER_ID }}
        run: |
          python scripts/generate_veo_to_pending.py

          echo "📄 video_plan.json content:"
          cat video_plan.json || echo "video_plan.json not found"
